name: ts-icon

x-backend: &backend
  build:
    context: .
    target: runner
  image: ts-icon-backend:local
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - db-data:/data
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [app]

services:
  migrate:
    build:
      context: .
      target: tools
    image: ts-icon-tools:local
    command: sh -c "npm run db:migrate && chown -R node:node /data"
    environment:
      DATABASE_URL: file:/data/dev.db
    volumes:
      - db-data:/data
    networks: [app]

  public:
    <<: *backend
    command: npm run start:public
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-3000}:3000"
    environment:
      IMG_WEB_PORT: "3000"
      DATABASE_URL: file:/data/dev.db
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.20.10}
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('http').get('http://127.0.0.1:3000/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  local:
    <<: *backend
    command: npm run start:local
    env_file: .env
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IMG_API_PORT: "3001"
      DATABASE_URL: file:/data/dev.db
      TS_HOST: ${TS_HOST:?Set TS_HOST in .env}
      AUTH_DISABLED: "false"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.20.10}
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('http').get('http://127.0.0.1:3001/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./webapp-banner-tool
      args:
        VITE_PUBLIC_API_URL: ""
        VITE_ADMIN_API_URL: /admin-api
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?Set VITE_KEYCLOAK_URL in .env}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:?Set VITE_KEYCLOAK_REALM in .env}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:?Set VITE_KEYCLOAK_CLIENT_ID in .env}
        VITE_KEYCLOAK_ENABLED: "true"
        VITE_KEYCLOAK_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-ts-icon-admin}
        VITE_KEYCLOAK_EDITOR_ROLE: ${OIDC_EDITOR_ROLE:-ts-icon-editor}
    image: ts-icon-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8088}:8080"
    depends_on:
      public:
        condition: service_healthy
      local:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.30.20.10
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/live]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db-data:

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.20.0/24
