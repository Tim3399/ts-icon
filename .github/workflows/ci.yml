name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: App checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITE_PUBLIC_API_URL: ""
      VITE_ADMIN_API_URL: /admin-api
      VITE_KEYCLOAK_URL: https://login.example.test
      VITE_KEYCLOAK_REALM: smoke
      VITE_KEYCLOAK_CLIENT_ID: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp-banner-tool/package-lock.json
      - run: npm install --global npm@11.7.0
      - run: npm ci
      - run: npm ci --prefix webapp-banner-tool
      - run: npm run db:generate
      - run: npm run check:format
      - run: npm run lint
      - run: npm run lint --prefix webapp-banner-tool
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build --prefix webapp-banner-tool
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm run test:ops
      - run: npm test --prefix webapp-banner-tool
      - run: npm audit --audit-level=high
      - run: npm audit --prefix webapp-banner-tool --audit-level=high
      - run: npm run audit:production
      - run: npm run audit:production --prefix webapp-banner-tool
      - name: Explain missing image-release configuration
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux' &&
          (vars.VITE_KEYCLOAK_URL == '' || vars.VITE_KEYCLOAK_REALM == '' || vars.VITE_KEYCLOAK_CLIENT_ID == '')
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Image publication awaits configuration
          All CI checks run normally. The image release job is skipped until these repository variables are set:
          - `VITE_KEYCLOAK_URL`
          - `VITE_KEYCLOAK_REALM`
          - `VITE_KEYCLOAK_CLIENT_ID`
          Set the real public Keycloak client values under Settings → Secrets and variables → Actions → Variables, then push or rerun this workflow. Never use placeholder login settings for released images.
          EOF

  browser:
    name: Browser workflows (desktop, mobile, tablet and zoom layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp-banner-tool/package-lock.json
      - run: npm install --global npm@11.7.0
      - run: npm ci --prefix webapp-banner-tool
      - run: npx playwright install --with-deps chromium
        working-directory: webapp-banner-tool
      - run: npm run test:e2e --prefix webapp-banner-tool
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            webapp-banner-tool/playwright-report
            webapp-banner-tool/test-results
          retention-days: 7

  docker:
    name: Container build, start and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: ts-icon-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          load: true
          tags: ts-icon-tools:ci
          cache-from: type=gha,scope=backend-tools
          cache-to: type=gha,mode=max,scope=backend-tools
      - uses: docker/build-push-action@v6
        with:
          context: ./webapp-banner-tool
          load: true
          tags: ts-icon-frontend:ci
          build-args: |
            VITE_PUBLIC_API_URL=
            VITE_ADMIN_API_URL=/admin-api
            VITE_KEYCLOAK_URL=https://login.example.test
            VITE_KEYCLOAK_REALM=smoke
            VITE_KEYCLOAK_CLIENT_ID=smoke
            VITE_KEYCLOAK_ENABLED=true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - run: node scripts/container-smoke.cjs

  release:
    name: Publish paired images
    needs: [checks, browser, docker]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.VITE_KEYCLOAK_URL != '' && vars.VITE_KEYCLOAK_REALM != '' && vars.VITE_KEYCLOAK_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VITE_PUBLIC_API_URL: ""
      VITE_ADMIN_API_URL: /admin-api
      VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
      VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM }}
      VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
      VITE_KEYCLOAK_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Validate before reserving a version or pushing either image.
      - run: node --input-type=module -e "import {validateBuildEnvironment} from './webapp-banner-tool/build-config.ts'; validateBuildEnvironment(process.env)"
      - name: Resolve immutable version reservation (retryable)
        id: version
        run: node scripts/release-version.cjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse immutable SHA candidates from an earlier attempt
        id: candidates
        run: node scripts/release-images.cjs inspect
      # The explicit version label is required: metadata-action otherwise
      # derives org.opencontainers.image.version from the highest-priority
      # tag, which is the `latest` alias here, so published images carried
      # `version=latest` instead of the product version. The promote step
      # re-reads both labels off the resolved digests and refuses to move any
      # alias if they disagree.
      - uses: docker/metadata-action@v5
        id: backend-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ts-icon-backend
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.publish_version == 'true' }}
      - uses: docker/metadata-action@v5
        id: frontend-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ts-icon-frontend
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.publish_version == 'true' }}
      - name: Publish backend candidate
        uses: docker/build-push-action@v6
        if: steps.candidates.outputs.backend_exists != 'true'
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.candidates.outputs.backend_candidate }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
      - name: Publish frontend candidate
        uses: docker/build-push-action@v6
        if: steps.candidates.outputs.frontend_exists != 'true'
        with:
          context: ./webapp-banner-tool
          push: true
          tags: ${{ steps.candidates.outputs.frontend_candidate }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_PUBLIC_API_URL=
            VITE_ADMIN_API_URL=/admin-api
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
            VITE_KEYCLOAK_ENABLED=true
            VITE_KEYCLOAK_ADMIN_ROLE=${{ vars.VITE_KEYCLOAK_ADMIN_ROLE }}
            VITE_KEYCLOAK_EDITOR_ROLE=${{ vars.VITE_KEYCLOAK_EDITOR_ROLE }}
          cache-from: type=gha,scope=frontend
      - name: Record digest pair and promote completed candidates
        run: node scripts/release-images.cjs promote
        env:
          BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-images-${{ github.sha }}
          path: .tmp/release-images.json
          if-no-files-found: ignore
          retention-days: 90
